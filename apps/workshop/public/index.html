<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover lets the page paint under the iOS status bar and
      home-indicator. interactive-widget=resizes-content makes Safari
      shrink the layout viewport when the on-screen keyboard appears.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>%WEB_TITLE%</title>

    <!--
      Default Open Graph + Twitter Card tags. Every URL on the domain
      that doesn't have a route-specific Pages Function override (e.g.
      `/invite/:token`, `/list/:id/...`) renders these for iMessage,
      Slack, Twitter, etc. Kept in sync with `buildMetaTagsRaw` in
      `packages/shared/src/og.ts` — if you change the surface there, mirror
      the tag set here. The og:image points at the dynamic edge renderer
      so we can refresh the artwork without touching this file.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Workshop.dev" />
    <meta property="og:url" content="https://workshop-a2v.pages.dev" />
    <meta property="og:title" content="Workshop.dev" />
    <meta property="og:description" content="Shared lists for the things you love." />
    <meta property="og:image" content="https://workshop-a2v.pages.dev/og/default.png" />
    <meta property="og:image:secure_url" content="https://workshop-a2v.pages.dev/og/default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Workshop.dev" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Workshop.dev" />
    <meta name="twitter:description" content="Shared lists for the things you love." />
    <meta name="twitter:image" content="https://workshop-a2v.pages.dev/og/default.png" />
    <meta name="description" content="Shared lists for the things you love." />

    <!--
      iOS Safari 15+ tints the URL bar / bottom toolbar with theme-color,
      and Android Chrome tints the address bar the same way. Declare both
      light + dark media variants because Safari historically only honored
      theme-color when an explicit media match was present. The app shell
      always paints the dark canvas (tokens.bg.canvas = #081325) regardless
      of the system color scheme, so we hard-pin both modes to that value
      to avoid a white flash above/below the page in iOS light mode.
    -->
    <meta name="theme-color" content="#081325" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#081325" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#081325" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workshop" />

    <!-- The `react-native-web` recommended style reset, plus a canvas-color
         lock so the overscroll / safe-area regions don't render white. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #081325;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
