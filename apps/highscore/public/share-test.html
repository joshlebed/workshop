<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#121216" />
    <title>HighScore share practice</title>
    <!--
      The share-setup walkthrough's practice page (apps/highscore/src/screens/
      ShareSetupWalkthrough.tsx opens it in Safari). Its Share button shares
      SHARE_PRACTICE_TEXT (src/lib/shareOnboarding.ts) — keep the two strings
      identical: the app recognises the practice share by exact text and shows
      "You're set" instead of the score picker.

      It lives in Safari, not in the app, on purpose: a share to HighScore's
      own extension from inside HighScore can leave the extension's sheet up
      over the app (expo-share-intent #231), and JS cannot dismiss it.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #121216;
        color: #f2effa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 48px 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
      }
      ol {
        margin: 0;
        padding: 16px 16px 16px 40px;
        text-align: left;
        line-height: 1.7;
        color: #a99ec2;
        background: #1c1528;
        border: 2px solid #3d2e55;
        border-radius: 12px;
      }
      ol b {
        color: #f2effa;
      }
      button {
        appearance: none;
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        padding: 16px;
        color: #121216;
        background: #ff3d9a;
        border: 0;
        border-radius: 12px;
      }
      p {
        margin: 0;
        color: #a99ec2;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Practice share</h1>
      <ol>
        <li>Tap <b>Share</b> below.</li>
        <li>Scroll the row of apps to the end and tap <b>More</b>.</li>
        <li>Tap <b>Edit</b>, then <b>+</b> next to HighScore.</li>
        <li>Tap <b>HighScore</b> in the row.</li>
      </ol>
      <button id="share" type="button">Share</button>
      <p id="note">HighScore opens and tells you it worked.</p>
    </main>
    <script>
      var PRACTICE_TEXT = "HighScore share test";
      var note = document.getElementById("note");
      document.getElementById("share").addEventListener("click", () => {
        if (!navigator.share) {
          note.textContent = "Open this page in Safari on your iPhone.";
          return;
        }
        navigator.share({ text: PRACTICE_TEXT }).catch(() => {});
      });
    </script>
  </body>
</html>
