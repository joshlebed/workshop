name: Detect changes
description: |
  Path filters shared by every CI job, as one GitHub API call + grep (~1s).
  Runs *inside* each job after checkout rather than as a separate `changes`
  job the others `needs:` — that hop was ~17s of serial latency on every PR.
  Replaced two dorny/paths-filter steps (~2–3s: two action downloads + two
  API round-trips) in #546.

  On pull_request the file list comes from the PR (so no .git is needed —
  the tarball checkout has none). On push every filter is true: the only
  push-time consumer is migrate-smoke on main, which is ~5s and safer run
  than skipped.

  Callers need `permissions: pull-requests: read`.
outputs:
  code:
    description: Anything but docs changed (gates checks + tests).
    value: ${{ steps.filter.outputs.code }}
  mobile:
    description: Workshop app / shared package / lockfile changed.
    value: ${{ steps.filter.outputs.mobile }}
  highscore_mobile:
    description: HighScore app / any package / lockfile changed.
    value: ${{ steps.filter.outputs.highscore_mobile }}
  migrations:
    description: Drizzle migrations / db schema / lockfile changed.
    value: ${{ steps.filter.outputs.migrations }}
  infra:
    description: Terraform changed.
    value: ${{ steps.filter.outputs.infra }}
  workflows:
    description: GitHub Actions workflows / composite actions changed.
    value: ${{ steps.filter.outputs.workflows }}
runs:
  using: composite
  steps:
    - id: filter
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [ "$EVENT" != "pull_request" ]; then
          for k in code mobile highscore_mobile migrations infra workflows; do
            echo "$k=true" >> "$GITHUB_OUTPUT"
          done
          echo "non-PR event: every filter true"
          exit 0
        fi
        # curl, not `gh api`: gh's startup is ~1s per call on the runner.
        files=""
        for page in 1 2 3 4 5; do
          chunk=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR/files?per_page=100&page=$page" | jq -r '.[].filename')
          files="$files${files:+$'\n'}$chunk"
          [ "$(echo "$chunk" | grep -c .)" -lt 100 ] && break
        done
        echo "$files" | sed 's/^/  /'
        any() { echo "$files" | grep -qE "$1" && echo true || echo false; }
        # Docs-only means every changed file matches one of these.
        code=$(echo "$files" | grep -vE '(\.md$|^docs/|^\.prettierrc\.json$|^\.prettierignore$)' | grep -q . && echo true || echo false)
        {
          echo "code=$code"
          echo "mobile=$(any '^(apps/workshop/|packages/shared/|pnpm-lock\.yaml$)')"
          echo "highscore_mobile=$(any '^(apps/highscore/|packages/|pnpm-lock\.yaml$)')"
          echo "migrations=$(any '^(apps/backend/drizzle/|apps/backend/src/db/|pnpm-lock\.yaml$)')"
          echo "infra=$(any '^infra/')"
          echo "workflows=$(any '^\.github/')"
        } | tee -a "$GITHUB_OUTPUT"
