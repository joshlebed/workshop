name: Setup pnpm + Node + cached deps
description: |
  Pin pnpm 10.34.9, restore the hoisted node_modules cache, and install via
  `pnpm fetch && pnpm install --offline` on cache miss. Pulls the same block
  out of every workflow so a pnpm bump is one edit instead of seven.

  Node comes from .nvmrc via actions/setup-node. .nvmrc pins a major ("24")
  on purpose: the runner image's toolcache ships 22.x and 24.x, so a
  major-only pin resolves to the cached build (~1s) instead of downloading
  (~4s per job, which is what 20.19.4 cost). Keep .nvmrc on a major the
  image caches (https://github.com/actions/runner-images, "Cached Tools").

  pnpm is a direct download of the standalone Linux binary from the pnpm
  GitHub release (~1s, sha256-pinned). `pnpm/action-setup` with
  `standalone: true` took ~8s per job: it npm-installs a self-installer, which
  installs the *latest* pnpm and then "switches" it to the pinned version.
  `corepack` / `npm i -g` would reach registry.npmjs.org, which timed out five
  times on 2026-11-03 (#535). To bump: change PNPM_VERSION + PNPM_SHA256 below
  (`curl -sSL .../v<ver>/pnpm-linux-x64 | sha256sum`).
outputs:
  cache-hit:
    description: Whether the node_modules cache was a hit (caller can skip its own install).
    value: ${{ steps.nm-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Install pnpm (standalone binary from GitHub releases)
      shell: bash
      env:
        PNPM_VERSION: 10.34.9
        PNPM_SHA256: 3ec79240658f0ee4e8977f21ee2c598c7a8b8d06b86dc564f2ec6cb099fd8ac2
      run: |
        set -euo pipefail
        if [ "$(uname -s)-$(uname -m)" != "Linux-x86_64" ]; then
          echo "::error::setup-pnpm only ships a Linux x64 binary; add an arch mapping"
          exit 1
        fi
        dest="$RUNNER_TEMP/pnpm-bin"
        mkdir -p "$dest"
        curl -fsSL --retry 3 --retry-all-errors \
          -o "$dest/pnpm" \
          "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-x64"
        echo "${PNPM_SHA256}  $dest/pnpm" | sha256sum -c -
        chmod +x "$dest/pnpm"
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/pnpm" --version

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    - name: Cache hoisted node_modules
      id: nm-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    # `pnpm fetch` populates the content-addressable store from pnpm-lock.yaml
    # in parallel; `pnpm install --offline` then symlinks from the store. ~20–30%
    # faster than a single `pnpm install` on cold cache because fetch parallelizes
    # downloads independently of the install graph.
    - name: Install deps (fetch + offline)
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        pnpm fetch
        pnpm install --frozen-lockfile --offline
