name: Deploy HighScore Mobile (OTA)

on:
  push:
    branches: [main]
    paths:
      - "apps/highscore/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-mobile-highscore.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mobile-highscore
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ota:
    name: Publish HighScore EAS Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # A new EAS project has no channels or branches. Bootstrap both once;
      # channel:create links a same-named channel and branch atomically.
      - name: Ensure production update channel
        working-directory: apps/highscore
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if pnpm exec eas channel:view production --json --non-interactive > /dev/null 2>&1; then
            echo "Production update channel already exists."
          else
            pnpm exec eas channel:create production --non-interactive
          fi

      # eas-cli is pinned in apps/highscore devDependencies so the OTA path
      # uses the same CLI version as the HighScore native-build workflow.
      - name: Publish HighScore JS bundle via EAS Update
        working-directory: apps/highscore
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ENABLE_GAMES: "1"
          EXPO_PUBLIC_APPLE_SERVICES_ID: live.highscore.web
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 267582241036-7vtcgkd594ldgimcu3dickj9u5ga951l.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 267582241036-vpbho0utb64bpvsjhkkk0cv14lp0dbie.apps.googleusercontent.com
          COMMIT_SHA: ${{ github.sha }}
        run: |
          pnpm exec eas update \
            --auto \
            --channel production \
            --environment production \
            --message "ci: $COMMIT_SHA"
