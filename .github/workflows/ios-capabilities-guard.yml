name: iOS capabilities guard

# Warn early when a PR changes iOS capabilities in either app's `app.json`
# (associatedDomains, entitlements, CFBundleURLTypes, infoPlist, usesAppleSignIn,
# and the `expo-share-intent` / `expo-apple-authentication` plugin config). The
# next TestFlight build after merge can fail at the eas-cli credentials step
# when a cached provisioning profile doesn't carry the new capability — this
# guard nudges the operator to delete that profile via
# `eas credentials --platform ios` before / right after merge, so the first
# build on `main` doesn't burn an EAS minute on a known-broken signing setup.
#
# Heads-up sticky comment, not a required check — capability changes are
# almost always intentional, and we want to ship them, not block them.
#
# Why not auto-delete the PP from CI? eas-cli's credential commands are
# interactive and authenticate via the operator's Apple-ID session, not
# the workflow ASC API key. Even with the key, automating PP deletion
# would race with concurrent builds and there's no rollback. The human
# loop is ~30s and only needed on capability toggles.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/workshop/app.json"
      - "apps/highscore/app.json"
      - ".github/workflows/ios-capabilities-guard.yml"

permissions:
  contents: read
  pull-requests: write # sticky comment

concurrency:
  group: ios-cap-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Diff iOS capabilities
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need merge-base for the diff

      - name: Compare iOS capability fields vs base branch
        id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Fields that, when changed, require the provisioning profile to
          # be regenerated. Extract them from each app via jq and diff the
          # canonicalised JSON.
          #
          # NB: jq's `|` binds looser than `,`, so the plugins element MUST be
          # fully parenthesised. Without the outer parens, `map(...)` distributes
          # across every comma-separated element and the first `null` field
          # (e.g. an absent `usesAppleSignIn`) throws "Cannot iterate over null",
          # failing the whole job on any app.json change.
          FIELDS='[
            .expo.ios.associatedDomains // null,
            .expo.ios.entitlements // null,
            .expo.ios.usesAppleSignIn // null,
            .expo.ios.infoPlist.CFBundleURLTypes // null,
            .expo.ios.bundleIdentifier // null,
            ((.expo.plugins // []) | map(select(
              type == "array" and (
                .[0] == "expo-share-intent" or
                .[0] == "expo-apple-authentication" or
                .[0] == "expo-notifications"
              )
            )))
          ]'
          CHANGED_APPS=()
          for app in workshop highscore; do
            git show "origin/${BASE_REF}:apps/$app/app.json" \
              | jq -S "$FIELDS" > "/tmp/base-$app.json"
            jq -S "$FIELDS" "apps/$app/app.json" > "/tmp/head-$app.json"

            if diff -q "/tmp/base-$app.json" "/tmp/head-$app.json" > /dev/null; then
              echo "No iOS capability changes for $app."
              continue
            fi

            CHANGED_APPS+=("$app")
            {
              echo "## iOS capabilities changed for $app"
              echo ""
              echo "The next TestFlight build for this app may need a fresh provisioning profile."
              echo ""
              echo "<details><summary>Diff (base → head)</summary>"
              echo ""
              echo '```diff'
              diff -u "/tmp/base-$app.json" "/tmp/head-$app.json" || true
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done

          if [ ${#CHANGED_APPS[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No iOS capability changes."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          CHANGED_CSV=$(IFS=,; echo "${CHANGED_APPS[*]}")
          echo "changed_apps=$CHANGED_CSV" >> "$GITHUB_OUTPUT"

      - name: Post / update sticky PR comment
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGED_APPS: ${{ steps.diff.outputs.changed_apps }}
        with:
          script: |
            const marker = '<!-- ios-cap-guard-comment -->';
            const apps = (process.env.CHANGED_APPS ?? '').split(',').filter(Boolean);
            const labels = { workshop: 'Workshop', highscore: 'HighScore' };
            const paths = apps.map(app => `\`apps/${app}/app.json\``).join(' and ');
            const commands = apps.map(app =>
              `cd apps/${app} && npx eas-cli@latest credentials --platform ios`,
            ).map(command => `\`\`\`bash\n${command}\n# production → Build Credentials → Provisioning Profile → Delete one\n\`\`\``).join('\n\n');
            const appNames = apps.map(app => labels[app]).join(' and ');
            const body = `${marker}
            ### ${appNames} iOS capabilities changed — provisioning profile check needed

            This PR touches iOS capability fields in ${paths}. If EAS already has
            a provisioning profile for the affected app, it may not carry the new
            capability. A first build with no cached profile will create one.

            **Before or right after merging**, run locally:

            ${commands}

            Then run the affected app's TestFlight workflow after merge (Workshop:
            \`testflight.yml\`; HighScore: \`testflight-highscore.yml\` once PR-8 lands).
            EAS regenerates the profile against current capabilities on the next build.

            See \`CLAUDE.md\` → "Provisioning profile out of sync after a
            capability toggle".`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
