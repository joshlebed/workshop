name: Verify Pages Deploy

# Production web (workshop-a2v.pages.dev) is deployed by Cloudflare Pages'
# native Git integration — Pages project `workshop`, source.type=github,
# production_branch=main, deployments_enabled=true. That build runs
#   pnpm install --frozen-lockfile && pnpm --filter workshop-app exec expo export --platform web
# (output apps/workshop/dist) and picks up the `functions/` Pages Functions
# automatically — i.e. it already does everything `wrangler pages deploy`
# would. CF also posts its build result back to the commit as the
# "Cloudflare Pages" check (app: cloudflare-workers-and-pages), so a failed
# build is visible on the PR/commit — not silent.
#
# This workflow therefore does NOT deploy. It waits for CF's deploy of the
# pushed commit to finish, then verifies the *runtime* behaviour CF's
# "build succeeded" status can't: that production still serves a raster OG
# image and a valid AASA document. That's the regression class that bit us
# before (a build succeeded but served an SVG og:image / dropped the AASA
# dotfile route, with zero signal until someone noticed in the wild).
#
# History: this used to run `wrangler pages deploy` from CI as a *second*
# deployer. It was redundant with the Git integration above and failed on
# every run with CF API error 7003 — the CLOUDFLARE_* CI secrets no longer
# resolve to the account that owns the `workshop` project. Dropping the
# wrangler step removes the redundant deploy and the dead secret dependency
# (no Cloudflare secrets are needed here anymore); the Git integration keeps
# shipping prod. For a manual deploy that bypasses the Git integration, use
# `pnpm deploy:pages[:preview]` (scripts/deploy-pages.sh) with a working
# CLOUDFLARE_API_TOKEN locally.

on:
  push:
    branches: [main]
    paths:
      - "apps/workshop/**"
      - "packages/shared/**"
      - "functions/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: verify-pages
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: Verify production Pages endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
    steps:
      # Wait for Cloudflare Pages' Git-integration build of THIS commit to
      # finish, so the smoke checks below run against the new deploy rather
      # than racing CF's build and verifying stale (but still-valid) content.
      # Surfaces a CF build failure here too, instead of only on CF's own check.
      - name: Wait for Cloudflare Pages deploy
        run: |
          set -euo pipefail
          echo "Waiting for the Cloudflare Pages build of ${SHA} ..."
          status=""; conclusion=""
          for i in $(seq 1 60); do
            run="$(gh api "repos/${REPO}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.app.slug=="cloudflare-workers-and-pages")] | sort_by(.completed_at // .started_at) | last' 2>/dev/null || true)"
            [ -z "$run" ] && run='{}'
            status="$(echo "$run" | jq -r '.status // "missing"')"
            conclusion="$(echo "$run" | jq -r '.conclusion // ""')"
            echo "attempt $i: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "✓ Cloudflare Pages build succeeded"
                exit 0
              fi
              echo "✗ Cloudflare Pages build concluded '$conclusion'"
              echo "$run" | jq -r '"  details: " + (.details_url // "n/a")'
              exit 1
            fi
            sleep 10
          done
          echo "✗ Timed out waiting for the Cloudflare Pages build of ${SHA}"
          echo "  (last seen status=$status conclusion=$conclusion)"
          echo "  Is the Pages Git integration still connected? dash.cloudflare.com → Pages → workshop"
          exit 1

      - name: Verify production OG endpoint serves PNG
        run: |
          set -euo pipefail
          URL="https://workshop-a2v.pages.dev/og/l/_smoke_check_slug.png"
          # Assert the actual PNG magic bytes (89 50 4E 47 0D 0A 1A 0A), not just
          # the content-type header — the regression we guard against was an SVG
          # served with an image content-type. `od`/`head` beat `file` for
          # portability. Short retry only to ride out CF edge-cache propagation.
          PNG_SIG="89504e470d0a1a0a"
          CT=""; SIG=""
          for i in 1 2 3 4 5 6; do
            CT="$(curl -sS -o /tmp/og.bin -w '%{content_type}' "$URL" || true)"
            SIG="$(head -c8 /tmp/og.bin | od -An -tx1 | tr -d ' \n' || true)"
            if [[ "$CT" == image/png* ]] && [[ "$SIG" == "$PNG_SIG" ]]; then
              echo "✓ OG endpoint returns a real PNG ($CT)"
              break
            fi
            echo "retry $i: ct=$CT sig=$SIG"
            sleep 5
          done
          if [[ "$CT" != image/png* ]] || [[ "$SIG" != "$PNG_SIG" ]]; then
            echo "✗ OG endpoint did not return a PNG after retries"
            echo "  content-type: $CT"
            echo "  first 8 bytes: $SIG (want $PNG_SIG)"
            exit 1
          fi

      # AASA must be served with `Content-Type: application/json` and parse as
      # valid JSON, or iOS silently rejects Universal Links. CF Pages routes
      # functions/.well-known/apple-app-site-association.ts to
      # /.well-known/apple-app-site-association — verify the dotfile directory
      # wasn't dropped by the function bundler.
      - name: Verify production AASA endpoint
        run: |
          set -euo pipefail
          URL="https://workshop-a2v.pages.dev/.well-known/apple-app-site-association"
          CT=""
          for i in 1 2 3 4 5 6; do
            CT="$(curl -sS -o /tmp/aasa.json -w '%{content_type}' "$URL" || true)"
            if [[ "$CT" == application/json* ]] && jq -e '.applinks.details[0].appIDs[0]' /tmp/aasa.json >/dev/null 2>&1; then
              APP_ID="$(jq -r '.applinks.details[0].appIDs[0]' /tmp/aasa.json)"
              echo "✓ AASA serves valid JSON for appID $APP_ID"
              exit 0
            fi
            echo "retry $i: ct=$CT body=$(head -c200 /tmp/aasa.json)"
            sleep 5
          done
          echo "✗ AASA endpoint did not serve valid JSON after retries"
          echo "  content-type: $CT"
          echo "  body:         $(head -c500 /tmp/aasa.json)"
          exit 1
