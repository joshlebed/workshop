name: Verify Pages Deploy

# Production web is deployed by two Cloudflare Pages native Git integrations:
# `workshop` builds apps/workshop with the repo-root functions/, while
# `highscore` uses root_dir=apps/highscore and that app's functions/. Both
# projects build main and post separate check runs (app:
# cloudflare-workers-and-pages) back to the pushed commit, so a failed build
# is visible on the PR/commit — not silent.
#
# This workflow therefore does NOT deploy. It waits for CF's deploy of the
# pushed commit to finish in both projects, then verifies the *runtime*
# behaviour CF's "build succeeded" status can't: that both production domains
# still serve a raster OG image and the expected AASA document. That's the
# regression class that bit us before (a build succeeded but served an SVG
# og:image / dropped the AASA dotfile route, with zero signal until someone
# noticed in the wild).
#
# History: this used to run `wrangler pages deploy` from CI as a *second*
# deployer. It was redundant with the Git integration above and failed on
# every run with CF API error 7003 — the CLOUDFLARE_* CI secrets no longer
# resolve to the account that owns the `workshop` project. Dropping the
# wrangler step removes the redundant deploy and the dead secret dependency
# (no Cloudflare secrets are needed here anymore); the Git integration keeps
# shipping prod. For a manual deploy that bypasses the Git integration, use
# `pnpm deploy:pages[:preview]` (scripts/deploy-pages.sh) with a working
# CLOUDFLARE_API_TOKEN locally.

on:
  push:
    branches: [main]
    paths:
      - "apps/workshop/**"
      - "apps/highscore/**"
      - "packages/**"
      - "functions/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-og.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: verify-pages
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: Verify production Pages endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
    steps:
      # Wait for Cloudflare Pages' Git-integration build of THIS commit to
      # finish, so the smoke checks below run against the new deploy rather
      # than racing CF's build and verifying stale (but still-valid) content.
      # Surfaces a CF build failure here too, instead of only on CF's own check.
      - name: Wait for Cloudflare Pages deploy
        run: |
          set -euo pipefail
          PROJECTS=(workshop highscore)
          declare -A STATUS_BY_PROJECT=(
            [workshop]="missing"
            [highscore]="missing"
          )
          declare -A CONCLUSION_BY_PROJECT=(
            [workshop]=""
            [highscore]=""
          )

          echo "Waiting for both Cloudflare Pages builds of ${SHA} ..."
          for i in $(seq 1 60); do
            runs="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" 2>/dev/null || true)"
            [ -z "$runs" ] && runs='{"check_runs":[]}'
            all_succeeded=1

            for project in "${PROJECTS[@]}"; do
              run="$(jq -c --arg project "$project" '
                [.check_runs[]
                  | select(.app.slug == "cloudflare-workers-and-pages")
                  | select((.details_url // "") | contains("/pages/view/" + $project + "/"))]
                | sort_by(.id)
                | last // {}
              ' <<<"$runs")"
              status="$(jq -r '.status // "missing"' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              STATUS_BY_PROJECT["$project"]="$status"
              CONCLUSION_BY_PROJECT["$project"]="$conclusion"
              echo "attempt $i: project=$project status=$status conclusion=$conclusion"

              if [ "$status" != "completed" ]; then
                all_succeeded=0
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                echo "✗ Cloudflare Pages project '$project' concluded '$conclusion'"
                jq -r '"  details: " + (.details_url // "n/a")' <<<"$run"
                exit 1
              fi
            done

            if [ "$all_succeeded" -eq 1 ]; then
              echo "✓ Both Cloudflare Pages builds succeeded"
              exit 0
            fi
            sleep 10
          done
          echo "✗ Timed out waiting for both Cloudflare Pages builds of ${SHA}"
          for project in "${PROJECTS[@]}"; do
            echo "  $project: status=${STATUS_BY_PROJECT[$project]} conclusion=${CONCLUSION_BY_PROJECT[$project]}"
          done
          echo "  Are both Pages Git integrations still connected? dash.cloudflare.com → Pages"
          exit 1

      - name: Checkout validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify production OG endpoint serves PNG
        run: |
          set -euo pipefail
          URLS=(
            "https://workshop-a2v.pages.dev/"
            "https://highscore.live/"
          )

          for url in "${URLS[@]}"; do
            succeeded=0
            for i in 1 2 3 4 5 6; do
              if node scripts/check-og.mjs "$url"; then
                succeeded=1
                break
              fi
              echo "retry $i: $url"
              sleep 5
            done
            if [ "$succeeded" -eq 1 ]; then
              echo "✓ OG metadata and raster image verified for $url"
            else
              echo "✗ OG verification failed after retries for $url"
              exit 1
            fi
          done

      # AASA must be served with `Content-Type: application/json`, parse as
      # valid JSON, and name the expected appID, or iOS silently rejects
      # Universal Links. CF Pages routes each project's
      # functions/.well-known/apple-app-site-association.ts to
      # /.well-known/apple-app-site-association — verify the dotfile directory
      # wasn't dropped by either function bundler.
      - name: Verify production AASA endpoint
        run: |
          set -euo pipefail
          DOMAINS=(
            "workshop-a2v.pages.dev"
            "highscore.live"
          )
          APP_IDS=(
            "Q65U6C65ZZ.dev.josh.workshop"
            "Q65U6C65ZZ.live.highscore.app"
          )

          for index in "${!DOMAINS[@]}"; do
            domain="${DOMAINS[$index]}"
            expected_app_id="${APP_IDS[$index]}"
            url="https://${domain}/.well-known/apple-app-site-association"
            aasa_file="/tmp/aasa-${index}.json"
            content_type=""
            succeeded=0

            for i in 1 2 3 4 5 6; do
              : > "$aasa_file"
              content_type="$(curl -sS -o "$aasa_file" -w '%{content_type}' "$url" || true)"
              if [[ "$content_type" == application/json* ]] && \
                jq -e --arg expected "$expected_app_id" \
                  '.applinks.details[0].appIDs[0] == $expected' \
                  "$aasa_file" >/dev/null 2>&1; then
                echo "✓ AASA serves valid JSON for appID $expected_app_id on $domain"
                succeeded=1
                break
              fi
              echo "retry $i: domain=$domain ct=$content_type body=$(head -c200 "$aasa_file")"
              sleep 5
            done

            if [ "$succeeded" -eq 1 ]; then
              continue
            fi

            echo "✗ AASA endpoint failed verification after retries for $domain"
            echo "  expected appID: $expected_app_id"
            echo "  content-type:   $content_type"
            echo "  body:           $(head -c500 "$aasa_file")"
            exit 1
          done
