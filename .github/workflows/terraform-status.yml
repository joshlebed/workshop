name: terraform-status

# Closes the "infra change merged but not applied" gap. CI doesn't apply
# (no broad AWS write creds in CI — keeps blast radius low). But the
# previous failure mode was silent: a PR touching infra/ merged green and
# looked deployed, yet nothing rolled out until someone ran
# `terraform apply` locally. This job runs a read-only `plan` against HCP
# on every push to main; if the plan has changes, the workflow goes red
# and the merge-commit status reflects "apply pending."
#
# Vars sourcing (workspace execution-mode is Local, so HCP workspace
# vars are NOT injected automatically — we feed them from the runner):
#   - database_url        ← SSM /workshop-prod/db/url via OIDC
#   - niteshift_external_id ← GH repo secret NITESHIFT_EXTERNAL_ID
# Other terraform vars use their declared defaults (empty string is fine
# for plan since the resources that read them already exist and won't
# change unless the .tf changes).

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-status.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OIDC AWS assume

concurrency:
  group: terraform-status
  cancel-in-progress: false

jobs:
  plan:
    name: terraform plan (detect unapplied changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch database_url from SSM
        id: ssm
        run: |
          DBURL=$(aws ssm get-parameter --name /workshop-prod/db/url \
            --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$DBURL"
          echo "dburl=$DBURL" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.14.7
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: terraform plan (detailed exit code)
        id: plan
        working-directory: infra
        env:
          TF_VAR_database_url: ${{ steps.ssm.outputs.dburl }}
          TF_VAR_niteshift_external_id: ${{ secrets.NITESHIFT_EXTERNAL_ID }}
        # -detailed-exitcode: 0 = no diff, 1 = error, 2 = diff (changes pending).
        # -refresh=false: skip the data-refresh phase. We deliberately don't
        # broaden the workshop-prod-github-actions role to ssm:GetParameter on
        # /workshop-prod/* (Lambda/migrations only need db_url + session_secret;
        # the rest of the SSM params have empty defaults and are managed by the
        # tfvars file). With refresh enabled, plan tries to read every existing
        # `aws_ssm_parameter` to detect out-of-band drift and gets 403'd on the
        # ones the OIDC role can't see. Skipping refresh still catches the case
        # this workflow exists for — "PR merged green but `terraform apply`
        # didn't run" — because plan still compares state-vs-code. The case it
        # misses is true out-of-band drift (someone fingers an SSM value or
        # IAM policy via the console), which we accept as out-of-scope here.
        run: |
          set +e
          terraform plan -input=false -refresh=false -detailed-exitcode -no-color > plan.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "── plan output ──"
          tail -n 200 plan.txt
          exit "$code"

      - name: Summarize
        if: always()
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
        run: |
          case "$EXIT_CODE" in
            0) echo "✓ Infra in sync with main — no apply needed." >> "$GITHUB_STEP_SUMMARY" ;;
            2) {
                 echo "⚠ Unapplied infra changes detected on main."
                 echo ""
                 echo "Someone needs to run \`terraform apply\` locally:"
                 echo ""
                 echo '```bash'
                 echo "cd infra && AWS_PROFILE=workshop-prod terraform apply"
                 echo '```'
               } >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "✗ terraform plan errored — see logs." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
