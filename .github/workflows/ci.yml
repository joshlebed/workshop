name: CI

# CI bills by job-minute (Ubuntu standard, rounded up), but the number the
# operator feels is PR wall-clock. Shape, and why (see "CI speed" in CLAUDE.md
# for the measurements behind each line):
#   - No separate `changes` job: every job runs the shared
#     .github/actions/detect-changes composite after checkout and gates its
#     own steps on the outputs. The old `needs: changes` hop cost ~17s of
#     serial latency on every PR; inline it is ~1s.
#   - `checks` installs deps once and runs the fast node-based checks: lint,
#     typecheck (tsgo — the native TypeScript port, ~3x faster than tsc here),
#     knip, prettier (md), redesign-plan consistency. actionlint and terraform
#     fmt+validate are path-gated (`.github/**`, `infra/**`) — they only say
#     something about those files.
#   - `test` runs the vitest workspace (root vitest.config.ts, one process for
#     all six packages) split into three shards on three runners. The suite is
#     CPU-bound (28 backend files each boot an in-memory PGlite, plus the
#     QuickJS game-code sandbox); shards run alongside `checks`, so PR
#     wall-clock is ~max(checks, slowest shard, metro bundle).
#   - `quality` is a zero-work gate that waits for `checks` + the shards and
#     carries the name branch protection requires, so the required-check list
#     doesn't change. It passes when its needs succeeded OR were skipped and
#     fails on any failure/cancellation.
#   - The per-app mobile bundle jobs and `migrate-smoke` stay separate (heavier
#     or different deps — Metro exports and a Postgres service container). The
#     Metro transform cache (/tmp/metro-cache) is restored from actions/cache;
#     a warm export is ~half the cold one.
#   - `gitleaks` only runs on push-to-main and a weekly schedule (pre-commit
#     lefthook is the PR-time guard; CI is the safety net).
#   - PRs own full validation; push-to-main only re-checks the canonical-branch
#     concerns (gitleaks always, migrate-smoke on migration changes). Skipping
#     the duplicate full PR re-run on merge cuts roughly half the CI bill.
#   - Docs-only PRs: every job still starts (~20s of setup each) but every
#     real step is skipped by the `code` filter and the job succeeds. This
#     replaced the ci-docs.yml shim, which posted a second, instantly-green
#     `Quality` on any PR that touched code *and* a `.md`, and auto-merge took
#     it (#476).
#   - Draft PRs skip every job. Agents (Niteshift, /continue-redesign) push
#     2–10 commits to a draft before flipping to ready-for-review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC — weekly gitleaks sweep

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks — install deps once, run every node-based check except the
  # test suite (which has its own sharded job below so the two overlap).
  # PR-only: push-to-main relies on the merge being a fast-forward of an
  # already-green PR head. If the merge introduces drift (rare; merge commits
  # don't change file content), the next PR will catch it.
  checks:
    name: Checks (lint, typecheck, knip, format, terraform, actionlint)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # detect-changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/detect-changes
        id: changes

      - uses: ./.github/actions/setup-pnpm
        if: steps.changes.outputs.code == 'true'

      - name: Lint (biome)
        if: steps.changes.outputs.code == 'true'
        run: pnpm run lint

      - name: Typecheck (tsgo)
        if: steps.changes.outputs.code == 'true'
        run: pnpm run typecheck

      - name: Knip (unused code/deps)
        if: steps.changes.outputs.code == 'true'
        run: pnpm run knip

      - name: Prettier (markdown)
        if: steps.changes.outputs.code == 'true'
        run: pnpm run format:md:check

      - name: Redesign-plan status consistency
        if: steps.changes.outputs.code == 'true'
        run: node scripts/check-redesign-plan-status.mjs

      - name: actionlint
        if: steps.changes.outputs.workflows == 'true'
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
        with:
          version: 1.7.12 # keep in sync with .mise.toml; a pin skips the "latest" lookup

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.changes.outputs.infra == 'true'
        with:
          terraform_version: 1.17.1

      # Cache provider plugins (~8 MB AWS provider) keyed on the lock file.
      # Without this, every run re-downloads on `terraform init`.
      - name: Cache Terraform plugins
        if: steps.changes.outputs.infra == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}

      - name: terraform fmt
        if: steps.changes.outputs.infra == 'true'
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: terraform validate (offline, no backend)
        if: steps.changes.outputs.infra == 'true'
        working-directory: infra
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          # Skip HCP backend for validation so PRs from forks can run.
          terraform init -backend=false
          terraform validate

  # The whole vitest workspace, split into shards. `--shard` partitions test
  # files by count; three shards measured ~17s / ~25s / ~26s on 4 cores when
  # this was introduced. Bump the matrix (and the `/N` below) if a shard
  # creeps past `checks` again.
  test:
    name: Test (shard ${{ matrix.shard }}/3)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # detect-changes
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/detect-changes
        id: changes

      - uses: ./.github/actions/setup-pnpm
        if: steps.changes.outputs.code == 'true'

      - name: Test
        if: steps.changes.outputs.code == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm exec vitest run --shard="$SHARD/3"

  # Gate with the name branch protection requires. Does no work of its own;
  # it reports the combined outcome of `checks` + `test`. `always()` so it
  # still runs when a need was skipped, but it stays skipped on drafts like
  # everything else, so a draft push costs nothing.
  quality:
    name: Quality (lint, typecheck, test, knip, format, terraform, actionlint)
    needs: [checks, test]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Combine results
        env:
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "checks=$CHECKS test=$TEST"
          for r in "$CHECKS" "$TEST"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job finished with '$r'"; exit 1 ;;
            esac
          done

  # Guards against the RN-drift bug class. Heavy enough (Expo export) to
  # justify its own job. PR-only — the merge commit doesn't change content.
  mobile-bundle:
    name: Mobile Metro bundle
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # detect-changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/detect-changes
        id: changes

      - uses: ./.github/actions/setup-pnpm
        if: steps.changes.outputs.mobile == 'true'

      # Deliberately NOT `expo install --check`: that merges Expo's remote
      # well-known-versions endpoint over the installed SDK's bundled map and
      # prefers the remote value, so an untouched commit goes red whenever
      # Expo publishes a new RN patch. The script pins the comparison to the
      # `expo/bundledNativeModules.json` the lockfile resolves — deterministic
      # per commit. `EXPO_OFFLINE=1` is not the fix; it skips validation
      # entirely. Scoped list lives in the script (react/typescript are pinned
      # above the SDK-preferred versions on purpose).
      - name: Verify RN deps match Expo SDK
        if: steps.changes.outputs.mobile == 'true'
        run: node scripts/check-expo-sdk-deps.mjs

      # Metro's transform cache. Keyed on the lockfile with a per-run suffix so
      # every run saves a fresh entry and the next one restores the newest
      # matching prefix (actions/cache entries are immutable).
      - name: Restore Metro cache
        if: steps.changes.outputs.mobile == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/metro-cache
          key: metro-workshop-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            metro-workshop-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            metro-workshop-${{ runner.os }}-

      - name: Bundle iOS (Metro codegen smoke)
        if: steps.changes.outputs.mobile == 'true'
        working-directory: apps/workshop
        run: pnpm exec expo export --platform ios --output-dir dist-ci

  # HighScore counterpart to the Workshop Metro smoke above. It has a distinct
  # check name so each app can be independently required and path-filtered.
  mobile-bundle-highscore:
    name: Mobile Metro bundle (highscore)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # detect-changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/detect-changes
        id: changes

      - uses: ./.github/actions/setup-pnpm
        if: steps.changes.outputs.highscore_mobile == 'true'

      - name: Verify RN deps match Expo SDK
        if: steps.changes.outputs.highscore_mobile == 'true'
        run: node scripts/check-expo-sdk-deps.mjs apps/highscore

      - name: Restore Metro cache
        if: steps.changes.outputs.highscore_mobile == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/metro-cache
          key: metro-highscore-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            metro-highscore-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            metro-highscore-${{ runner.os }}-

      - name: Bundle iOS (Metro codegen smoke)
        if: steps.changes.outputs.highscore_mobile == 'true'
        working-directory: apps/highscore
        run: pnpm exec expo export --platform ios --output-dir dist-ci

  # Guards against the migration-drift bug class. Spins up Postgres, applies,
  # re-applies (must be a no-op). Runs on PRs that touch migrations AND on
  # push-to-main when migrations changed (canonical-branch safety net).
  migrate-smoke:
    name: Migrate smoke (fresh DB + idempotent re-run)
    if: github.event_name != 'schedule' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # detect-changes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      STAGE: local
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workshop
      # 32+ char placeholder; migrate never reads it, but config.ts validates length.
      SESSION_SECRET: ci_migrate_smoke_session_secret_padding_32
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/detect-changes
        id: changes

      - uses: ./.github/actions/setup-pnpm
        if: steps.changes.outputs.migrations == 'true'

      - name: Journal ↔ file consistency
        if: steps.changes.outputs.migrations == 'true'
        working-directory: apps/backend
        run: node ../../scripts/check-drizzle-journal.mjs

      - name: Apply migrations (fresh DB)
        if: steps.changes.outputs.migrations == 'true'
        working-directory: apps/backend
        run: pnpm run db:migrate

      - name: Re-apply migrations (must be a no-op)
        if: steps.changes.outputs.migrations == 'true'
        working-directory: apps/backend
        run: pnpm run db:migrate

      - name: Verify journal row count
        if: steps.changes.outputs.migrations == 'true'
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          applied=$(psql -h localhost -U postgres -d workshop -tAc \
            "select count(*) from drizzle.__drizzle_migrations")
          expected=$(find apps/backend/drizzle -maxdepth 1 -name '*.sql' | wc -l)
          echo "applied=$applied expected=$expected"
          test "$applied" = "$expected"

  # Pre-commit lefthook runs gitleaks on staged files for any developer with
  # the binary installed. CI is the safety net: scan on every push to main
  # (catches anything that bypassed pre-commit) and weekly to catch drift /
  # rule-set updates against the full history.
  gitleaks:
    name: gitleaks
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists commits via the GitHub API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
