name: TestFlight (native iOS build)

# Runs on main. @expo/fingerprint hashes everything that affects the native
# binary (native deps, config plugins, app.json, assets wired up as icons/
# splash, etc.). If the hash differs from the last successful build, this
# enqueues an EAS build and **waits** for it to finish before writing the
# fingerprint tag — i.e. the tag now records what actually shipped, not
# what got accepted into the queue.
#
#   fingerprint  →  build (await success) + auto-submit  →  tag
#
# Trade-off vs the old fire-and-forget model: ~30 min of GH Actions
# runner-time per native build (vs ~1 min for `--no-wait`). On a personal
# project we ship ~5 native builds/month, so the cost is ~150 GH Actions
# minutes/month — well under the 2000-min free-tier ceiling. In exchange:
#   - EAS build failures (signing drift, runtime-version mismatch, infra
#     5xx) surface as red CI rather than silent green + a stalled
#     TestFlight pipeline.
#   - The fingerprint tag is only written on a real green build, so a
#     subsequent push with the same fingerprint correctly skips instead of
#     re-trying a known-failed enqueue.
#
# Recovery when something gets stuck:
#
#   git tag -d ios-fp-<hash> && git push origin :refs/tags/ios-fp-<hash>
#   gh workflow run testflight.yml --ref main --field force=true
#
# The runtime-version policy is `appVersion` (see app.json) — not
# `fingerprint`. This is deliberate: `@expo/fingerprint` produces different
# hashes on the Linux GH Actions runner vs the macOS EAS Build worker (the
# node_modules contents of several native packages — async-storage,
# reanimated, screens, safe-area-context, worklets — diverge between
# platforms because of postinstall artifacts, and the EAS-side prebuild
# adds an `ios/` dir the Linux fingerprint never sees). With fingerprint
# policy that mismatch killed every EAS build for ~24h because the
# `Configure expo-updates` step rejects builds whose pre-submit runtime
# version disagrees with the post-prebuild one. `appVersion` policy is
# deterministic across OSes — the runtime version is just the `version`
# field in app.json — and `eas update --auto` produces the same value, so
# OTAs always target a runtime version that some real TestFlight build
# actually has. Bump `version` in app.json when you add a native module so
# OTAs aren't shipped to old installs that lack the new native code.

on:
  push:
    branches: [main]
    paths:
      - "apps/workshop/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if fingerprint is unchanged"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# Concurrency is split per-job:
#   - fingerprint: cheap to redo. cancel-in-progress=true so a rapid-fire
#     stack of pushes only runs the fingerprint check once (the latest one).
#     This was the source of stuck-queue minute-burn (11 cancelled runs /
#     154 min wall-clock in a 6-day window): rapid pushes piled up behind
#     a slow fingerprint and each waited for its turn before being killed.
#   - build: NEVER cancel — once `eas build` returns the EAS-side build is
#     already running on EAS infra. Cancelling the GH job here only orphans
#     the tag write and wastes the EAS build minute that's about to land.
#     New pushes queue behind the active build.
# No workflow-level concurrency; the job-level groups are what matter.

permissions:
  contents: write # push fingerprint tag after successful build

# Pin eas-cli to a known-good version so EAS releases don't silently change
# the JSON schema of `eas build --json` (which the build job parses) or the
# behaviour of `--non-interactive`. Bump deliberately.
env:
  EAS_CLI_VERSION: "18.8.1"

jobs:
  fingerprint:
    name: Check fingerprint
    runs-on: ubuntu-latest
    # Fingerprint is cheap and idempotent. Bursty merges should collapse to
    # one fingerprint run on the latest SHA, not pile up.
    concurrency:
      group: testflight-fingerprint
      cancel-in-progress: true
    # Hard cap: a fingerprint job that hasn't completed in 4 minutes is
    # almost certainly stuck (Expo registry / pnpm install hang). Kill it
    # rather than letting it block enqueues for 10 minutes.
    timeout-minutes: 4
    outputs:
      hash: ${{ steps.fp.outputs.hash }}
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need tags for the compare

      - uses: ./.github/actions/setup-pnpm

      # The fingerprint is just a CI idempotency key — "have I already
      # shipped a build for this exact native shape?". It is NOT the
      # runtime version baked into the build artifact (that's `appVersion`
      # from app.json). So the Linux-vs-macOS hash drift that breaks the
      # `fingerprint` runtime-version policy doesn't matter here: we only
      # compare Linux hash to Linux hash via the tag.
      - name: Compute iOS fingerprint
        id: fp
        working-directory: apps/workshop
        run: |
          HASH=$(node -e "require('@expo/fingerprint').createProjectHashAsync('.').then(h => process.stdout.write(h))")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "iOS fingerprint: $HASH"

      - name: Decide whether to build
        id: decide
        env:
          FP_HASH: ${{ steps.fp.outputs.hash }}
          FORCE: ${{ inputs.force }}
        run: |
          TAG="ios-fp-$FP_HASH"
          if [ "$FORCE" = "true" ]; then
            echo "Force build requested"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## 🟢 Build needed"
              echo ""
              echo "**Reason**: \`force=true\` workflow_dispatch input."
              echo ""
              echo "**Fingerprint**: \`$FP_HASH\`"
            } >> "$GITHUB_STEP_SUMMARY"
          elif git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Fingerprint already built ($TAG) — skipping"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## 🟡 Skipped — no native change"
              echo ""
              echo "**Fingerprint**: \`$FP_HASH\`"
              echo ""
              echo "Already built (tag \`$TAG\` exists). Did not consume an EAS Build minute."
              echo "OTA changes ship via \`Deploy Mobile (OTA)\` instead. Force a rebuild via"
              echo "\`gh workflow run testflight.yml --ref main --field force=true\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "New fingerprint — build needed"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## 🟢 Build needed"
              echo ""
              echo "**Reason**: new iOS fingerprint."
              echo ""
              echo "**Fingerprint**: \`$FP_HASH\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build + submit (await EAS)
    needs: fingerprint
    if: needs.fingerprint.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    # NEVER cancel an in-flight build: once `eas build` returns the EAS-
    # side build is already running on EAS infra, and cancelling here only
    # wastes the EAS build minute and orphans the tag write. New pushes
    # wait their turn behind any active build.
    concurrency:
      group: testflight-build
      cancel-in-progress: false
    # EAS iOS builds are ~25–30 min wall-clock plus a few minutes for
    # auto-submit. 60 min gives slack for slow EAS queues / submit
    # contention without burning runner time on a wedged build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `eas build` runs the actual build remotely on EAS infra, but the
      # _local_ eas-cli still has to read `app.json` via `npx expo config
      # --json` and resolve config plugins (`expo-router`, ...) against this
      # repo's `node_modules`. Without an install the resolve fails with
      # `Failed to resolve plugin for module "expo-router"` and the enqueue
      # never happens. PR #97 dropped this install thinking it was unused;
      # it's not — every TestFlight run since has been red. Cache hit is
      # ~10s, miss is ~30s.
      - uses: ./.github/actions/setup-pnpm

      # Write the App Store Connect API key to disk so eas-cli can
      # authenticate with Apple non-interactively. Required whenever a
      # build needs to create or rotate credentials — most commonly the
      # FIRST build of a new bundle id (share extension, widget, push
      # extension target). Without this, eas-cli falls through to
      # interactive Apple-ID prompts and fails the build at
      # `Distribution Certificate is not validated for non-interactive
      # builds` / `Credentials are not set up. Run this command again in
      # interactive mode`. The .p8 lives in `runner.temp` so it's wiped
      # at job teardown.
      #
      # Provisioning the secrets is a one-time human step (Apple won't
      # mint an ASC API key without an interactive Apple-ID session).
      # See `docs/manual-setup.md` §5 for the website-only flow.
      - name: Write ASC API key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
        run: |
          set -euo pipefail
          if [ -z "$ASC_API_KEY_CONTENT" ]; then
            echo "::error::ASC_API_KEY_CONTENT secret is not set. See docs/manual-setup.md §5"
            echo "::error::for the one-time setup: create an App Store Connect API key, then add"
            echo "::error::ASC_API_KEY_CONTENT (.p8 contents), ASC_API_KEY_ID (10-char), and"
            echo "::error::ASC_API_ISSUER_ID (UUID) as GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$ASC_API_KEY_CONTENT" > "$ASC_API_KEY_PATH"
          chmod 600 "$ASC_API_KEY_PATH"

      # No `--no-wait`: we want this step to exit on the actual build
      # outcome, not on enqueue acceptance. `--auto-submit` still chains
      # the TestFlight submit on EAS's side after the build succeeds, so
      # this step blocks on the build (~30 min) but not on the submit.
      - name: Build + auto-submit (await success)
        id: build
        working-directory: apps/workshop
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APPLE_SERVICES_ID: dev.josh.workshop.web
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 267582241036-cpnoae8vhaj8e3ftq3lmldef2c7hco33.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 267582241036-vpbho0utb64bpvsjhkkk0cv14lp0dbie.apps.googleusercontent.com
          CLI_VERSION: ${{ env.EAS_CLI_VERSION }}
          # ASC API key auth for both credentials management (cert/profile
          # generation) and `--auto-submit`. Takes precedence over any
          # ASC key registered server-side on EAS for this project.
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          BUILD_JSON=$(npx "eas-cli@$CLI_VERSION" build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit \
            --json)
          # `eas build --json` returns an array; the [0]th element is this build.
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id')
          BUILD_STATUS=$(echo "$BUILD_JSON" | jq -r '.[0].status')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "Failed to extract build ID from eas build output:"
            echo "$BUILD_JSON"
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"

      - name: Summarize build outcome
        if: always() && steps.build.outputs.build_id != ''
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          BUILD_STATUS: ${{ steps.build.outputs.build_status }}
          FP_HASH: ${{ needs.fingerprint.outputs.hash }}
        run: |
          ICON="🟢"
          if [ "$BUILD_STATUS" != "FINISHED" ]; then
            ICON="🔴"
          fi
          {
            echo "## $ICON Build $BUILD_STATUS"
            echo ""
            echo "**Build ID**: \`$BUILD_ID\`"
            echo ""
            echo "**Fingerprint**: \`$FP_HASH\`"
            echo ""
            echo "[View build on EAS](https://expo.dev/accounts/joshlebed/projects/workshop/builds/$BUILD_ID)"
            echo ""
            if [ "$BUILD_STATUS" = "FINISHED" ]; then
              echo "Auto-submit to TestFlight is queued on EAS (separate from this build)."
              echo "Check [App Store Connect](https://appstoreconnect.apple.com) once the submission lands."
            else
              echo "Build did not finish cleanly. See the EAS build log linked above for the failing step."
              echo "Recovery: fix the underlying issue, delete the fingerprint tag (\`ios-fp-$FP_HASH\`),"
              echo "and dispatch \`testflight.yml\` with \`force=true\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Tag the fingerprint only after the build is confirmed green. With
      # `--no-wait` we used to tag on enqueue, which let an EAS-side failure
      # poison subsequent pushes (they'd see the tag and skip). Waiting +
      # tag-after-success removes that footgun.
      - name: Tag successful fingerprint
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FP_HASH: ${{ needs.fingerprint.outputs.hash }}
        run: |
          TAG="ios-fp-$FP_HASH"
          git tag "$TAG"
          git push origin "$TAG"

  # Wake the operator when a TestFlight run fails. Native iOS builds happen
  # ~5×/month on personal-project cadence, so a silent red run is easy to
  # miss — and we just spent 2 days in that state with the share extension
  # build broken. Ping `#workshop-admin` via Discord webhook with the run
  # URL and a self-help hint pointing at `pnpm setup:asc-key`. The
  # notification fires on `failure` only; a `skipped` build (fingerprint
  # unchanged, no native diff) is not a problem and stays silent.
  #
  # Webhook URL lives in `DISCORD_NOTIFY_WEBHOOK_URL` GH Actions secret.
  # Missing secret degrades to a CI warning rather than a hard failure —
  # the notification is best-effort, the underlying build status is the
  # source of truth.
  notify:
    name: Notify on failure
    needs: [fingerprint, build]
    if: always() && (needs.fingerprint.result == 'failure' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_NOTIFY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FP_RESULT: ${{ needs.fingerprint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_NOTIFY_WEBHOOK_URL not set — skipping Discord ping. See docs/manual-setup.md §5 for setup."
            exit 0
          fi
          FIRST_LINE=$(printf '%s' "${COMMIT_MSG:-(no message)}" | head -n1)
          SHORT_SHA="${COMMIT_SHA:0:7}"
          FAILED_JOB="build"
          if [ "$FP_RESULT" = "failure" ]; then FAILED_JOB="fingerprint"; fi
          PAYLOAD=$(jq -n \
            --arg content "🔴 **TestFlight \`${FAILED_JOB}\` job failed** — a human is needed" \
            --arg title "Action required" \
            --arg url "$RUN_URL" \
            --arg sha "$SHORT_SHA" \
            --arg msg "$FIRST_LINE" \
            --arg desc "Check the run for \`::error::\` annotations.\n\n• If \`Write ASC API key\` failed → secret is missing or stale. Run \`pnpm setup:asc-key\` locally (interactive, ~3 min) to rotate.\n• If \`Build + auto-submit\` failed → check the EAS build log. Recovery patterns in \`CLAUDE.md\` → iOS deploy pipeline." \
            '{
              content: $content,
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 15158332,
                fields: [
                  {name: "Commit", value: ($sha + " — " + $msg), inline: false},
                  {name: "Run",    value: $url, inline: false}
                ]
              }]
            }')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
          echo "Posted failure notification to Discord."
